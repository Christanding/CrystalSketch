name: Installation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Online bootstrap on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_MANAGED_PYTHON: '1'
      UV_PYTHON_DOWNLOADS: automatic
      UV_NO_CONFIG: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Configure isolated installation directories
        shell: bash
        run: |
          printf '%s\n' \
            "UV_INSTALL_DIR=$RUNNER_TEMP/crystal-bootstrap-uv" \
            "UV_TOOL_DIR=$RUNNER_TEMP/crystal-bootstrap-tools" \
            "UV_TOOL_BIN_DIR=$RUNNER_TEMP/Crystal bootstrap a'a commands" \
            "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/crystal-bootstrap-python" \
            "UV_CACHE_DIR=$RUNNER_TEMP/crystal-bootstrap-cache" >> "$GITHUB_ENV"

      - name: Verify Windows bootstrap failure handling
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\bootstrap_windows.ps1

      - name: Install without preconfigured development tools (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # No setup-python/setup-uv/setup-bun. Force a fresh managed Python rather
          # than using an interpreter provided by the runner image.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            PATH=/usr/bin:/bin:/usr/sbin:/sbin bash scripts/bootstrap.sh
          else
            # Exercise the published one-line entry, pinned to the commit under test.
            PATH=/usr/bin:/bin:/usr/sbin:/sbin bash -o pipefail -c \
              'curl -fsSL "https://raw.githubusercontent.com/Christanding/CrystalSketch/$GITHUB_SHA/scripts/bootstrap.sh" | bash'
          fi
          printf '%s\n' "$UV_INSTALL_DIR" "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"

      - name: Install without preconfigured development tools (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:Path = (@($env:Path -split ';' | Where-Object {
            $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'uv.exe')) -and
              -not (Test-Path -LiteralPath (Join-Path $_ 'bun.exe')) -and
              -not (Test-Path -LiteralPath (Join-Path $_ 'git.exe')) -and
              -not (Test-Path -LiteralPath (Join-Path $_ 'python.exe')) -and
              -not (Test-Path -LiteralPath (Join-Path $_ 'python3.exe'))
          }) -join ';')
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            & ([scriptblock]::Create((Get-Content -LiteralPath .\scripts\bootstrap.ps1 -Raw)))
          } else {
            & ([scriptblock]::Create((Invoke-RestMethod "https://raw.githubusercontent.com/Christanding/CrystalSketch/$env:GITHUB_SHA/scripts/bootstrap.ps1")))
          }
          @($env:UV_INSTALL_DIR, $env:UV_TOOL_BIN_DIR) |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify installed command and repeated launch
        run: uv run --no-project --python 3.12 python scripts/smoke_install.py --work-dir "${{ runner.temp }}"

      - name: Verify uninstall preserves Python and unrelated environments
        shell: bash
        run: |
          uv run --no-project --python 3.12 python - <<'PY'
          import os, shutil, subprocess, sys
          from pathlib import Path
          interpreter = Path(sys.executable).resolve()
          python_root = Path(os.environ["UV_PYTHON_INSTALL_DIR"]).resolve()
          assert interpreter.is_relative_to(python_root), "Bootstrap reused a host Python"
          uv = shutil.which("uv")
          assert uv is not None
          unrelated = Path(os.environ["RUNNER_TEMP"]) / "unrelated-python-environment"
          subprocess.run([uv, "venv", "--python", str(interpreter), str(unrelated)], check=True)
          subprocess.run([uv, "tool", "uninstall", "crystalsketch"], check=True)
          assert not (Path(os.environ["UV_TOOL_DIR"]) / "crystalsketch").exists()
          assert shutil.which("Crystal") is None
          assert Path(uv).is_file() and interpreter.is_file()
          assert (unrelated / "pyvenv.cfg").is_file()
          subprocess.run([str(interpreter), "--version"], check=True)
          print("PASS: only CrystalSketch removed; uv, Python and unrelated environment retained")
          PY

  install:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        if: runner.os != 'Windows'
      - uses: oven-sh/setup-bun@v2
        if: runner.os != 'Windows'
        with:
          bun-version: "1.3.13"

      - name: Use a Windows command path containing spaces and apostrophes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolBin = Join-Path $env:RUNNER_TEMP "Crystal a'a'a commands"
          "UV_TOOL_BIN_DIR=$toolBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install from source (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh
      - name: Install from source (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:UV_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "Crystal uv a'a tools"
          $env:UV_UNMANAGED_INSTALL = $null
          $env:UV_NO_MODIFY_PATH = '1'
          $env:BUN_INSTALL = Join-Path $env:RUNNER_TEMP "Crystal bun a'a tools"
          # Exercise both real bootstraps even if the runner image ships these tools.
          $env:Path = (@($env:Path -split ';' | Where-Object {
            $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'uv.exe')) -and
              -not (Test-Path -LiteralPath (Join-Path $_ 'bun.exe'))
          }) -join ';')
          $sentinel = Join-Path $env:RUNNER_TEMP 'Crystal session-only path'
          $env:Path = "$sentinel;$env:Path"
          $before = @($env:Path -split ';')
          & .\scripts\install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Source installation failed.' }
          $after = @($env:Path -split ';')
          if (@($before | Where-Object { $_ -and $after -notcontains $_ }).Count -ne 0) {
            throw 'Tool bootstrap removed existing machine or session PATH entries.'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:UV_INSTALL_DIR 'uv.exe'))) { throw 'Custom uv bootstrap was not exercised.' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:BUN_INSTALL 'bin\bun.exe'))) { throw 'Bun bootstrap was not exercised.' }
          @($env:UV_INSTALL_DIR, (Join-Path $env:BUN_INSTALL 'bin')) |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Expose the installed global command
        if: runner.os != 'Windows'
        shell: python {0}
        run: |
          import os
          import subprocess
          tool_bin = subprocess.check_output(["uv", "tool", "dir", "--bin"], text=True).strip()
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(tool_bin + "\n")

      - name: Verify the source installation outside the repository
        run: python scripts/smoke_install.py --work-dir "${{ runner.temp }}"

      - name: Verify Windows single-instance locking and crash recovery
        if: runner.os == 'Windows'
        run: uv run --locked pytest tests/test_single_instance.py tests/test_cli.py

      - name: Extract the generated release bundle
        shell: python {0}
        run: |
          import os
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("dist/CrystalSketch.zip") as bundle:
              bundle.extractall(Path(os.environ["RUNNER_TEMP"]) / "release-install")

      - name: Install the release bundle (macOS / Linux)
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/release-install/CrystalSketch
        run: bash install.sh
      - name: Install the release bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/release-install/CrystalSketch
        run: |
          $oldWheel = Join-Path (Get-Location) 'crystalsketch-0.0.0-py3-none-any.whl'
          Set-Content -LiteralPath $oldWheel -Value 'An older wheel must not be selected.'
          (Get-Item -LiteralPath $oldWheel).LastWriteTimeUtc = [datetime]'2000-01-01T00:00:00Z'
          if ((Get-ChildItem -Filter 'crystalsketch-*.whl' -File | Select-Object -First 1).FullName -ne $oldWheel) {
            throw 'The stale-wheel fixture must expose the previous first-item selection bug.'
          }
          $env:UV_INSTALL_DIR = $null
          $env:UV_UNMANAGED_INSTALL = Join-Path $env:RUNNER_TEMP "Crystal unmanaged uv a'a tools"
          $env:Path = (@($env:Path -split ';' | Where-Object {
            $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'uv.exe'))
          }) -join ';')
          powershell -ExecutionPolicy Bypass -File .\install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Release installation failed.' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:UV_UNMANAGED_INSTALL 'uv.exe'))) {
            throw 'Unmanaged uv bootstrap was not exercised.'
          }

      - name: Verify the release installation outside the repository
        run: python scripts/smoke_install.py --work-dir "${{ runner.temp }}"

      - name: Verify Windows repair is persistent and idempotent
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}/release-install/CrystalSketch
        run: |
          $before = [Environment]::GetEnvironmentVariable('Path', 'User')
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -RepairPath
          if ($LASTEXITCODE -ne 0) { throw 'PATH repair failed.' }
          $after = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($before -cne $after) { throw 'Repeated repair changed the saved user PATH.' }
          $entries = @($after -split ';' | Where-Object { $_ -eq $env:UV_TOOL_BIN_DIR })
          if ($entries.Count -ne 1) { throw 'The tool directory is missing or duplicated.' }
